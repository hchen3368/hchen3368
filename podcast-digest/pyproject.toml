[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-digest"
version = "0.1.0"
description = "Turn long podcast episodes into short audio digests."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "openai>=1.60",
]

[project.optional-dependencies]
local-whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
podcast-digest = "podcast_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
