name: Publish to Bilibili

on:
  push:
    paths:
      - "podcast-digest/bilibili-queue/**"
      - "podcast-digest/bilibili-requests/**"
  workflow_dispatch:
    inputs:
      immediate:
        description: "Publish right away instead of scheduling for the next evening"
        type: boolean
        default: false
      dry_run:
        description: "Only show what would be uploaded"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bilibili-publish
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: podcast-digest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e '.[bilibili]'

      - name: Write Bilibili credentials
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          if [ -z "$BILIBILI_COOKIES" ]; then
            echo "::error::Missing repository secret BILIBILI_COOKIES (see podcast-digest/README.md)"
            exit 1
          fi
          umask 077
          printf '%s' "$BILIBILI_COOKIES" > "$RUNNER_TEMP/bilibili_cookies.json"

      - name: Upload queued episodes
        run: >
          podcast-digest bilibili-upload-queue
          --cookies "$RUNNER_TEMP/bilibili_cookies.json"
          ${{ inputs.immediate && '--immediate' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Show submissions on the account
        if: ${{ always() }}
        continue-on-error: true
        run: podcast-digest bilibili-status --cookies "$RUNNER_TEMP/bilibili_cookies.json"

      - name: Record uploads
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilibili-queue
          if ! git diff --cached --quiet; then
            git commit -m "Record Bilibili uploads"
            git push
          fi

      - name: Remove credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/bilibili_cookies.json"
